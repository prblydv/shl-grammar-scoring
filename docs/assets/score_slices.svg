  <g id="text_27">
   <text style="fill: #68758a; font: 10px 'DejaVu Sans'; text-anchor: start" x="22.333437" y="36.432" transform="rotate(-0 22.333437 36.432)">Original labels retained. Zero cases are shown separately rather than hidden in the average.</text>
