  <g id="text_28">
   <text style="fill: #68758a; font: 9px 'DejaVu Sans'; text-anchor: start" x="22.333437" y="395.568" transform="rotate(-0 22.333437 395.568)">Target-conditioned bias is descriptive; it does not, by itself, prove global miscalibration or justify score expansion.</text>
